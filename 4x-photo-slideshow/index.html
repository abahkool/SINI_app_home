<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>4X Photo Slideshow — download for your system</title>
<style>
    :root {
        --bg: #F7F3FB; --surface: #FFFFFF; --surface2: #F2ECF7;
        --text: #1C1B1F; --muted: #55505C;
        --primary: #6750A4; --primary-dark: #4F378B; --border: #E4DBEE;
        --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
        :root {
            --bg: #121016; --surface: #1C1922; --surface2: #221E2A;
            --text: #E7E1EF; --muted: #B4ACBF;
            --primary: #D0BCFF; --primary-dark: #EADDFF; --border: #33293F;
        }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        margin: 0; background: var(--bg); color: var(--text);
        font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
        width: 100%; max-width: 460px; background: var(--surface);
        border: 1px solid var(--border); border-radius: var(--radius);
        padding: 30px 28px; text-align: center;
        box-shadow: 0 10px 30px rgba(52, 34, 74, .10);
    }
    .logo { width: 56px; height: 56px; border-radius: 15px; background: var(--surface2); display: inline-flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 14px; }
    h1 { font-size: 1.15rem; margin: 0 0 6px; letter-spacing: -.01em; }
    p { margin: 0; font-size: .9rem; line-height: 1.55; color: var(--muted); }
    .status { margin-top: 18px; font-size: .92rem; color: var(--text); min-height: 1.4em; }
    .spinner {
        display: inline-block; width: 15px; height: 15px; margin-right: 8px;
        border: 2px solid var(--border); border-top-color: var(--primary);
        border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .options { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
    .btn {
        display: block; padding: 12px 18px; border-radius: 24px; text-decoration: none;
        font-size: .9rem; font-weight: 600; border: 1px solid var(--border);
        background: var(--surface2); color: var(--text);
    }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn:hover { filter: brightness(.97); }
    .meta { margin-top: 18px; font-size: .74rem; color: var(--muted); }
    .hidden { display: none; }
    @media (prefers-color-scheme: dark) { .btn-primary { color: #1C1B1F; } }
</style>
</head>
<body>
<main class="card">
    <div class="logo" aria-hidden="true">🖼️</div>
    <h1>4X Photo Slideshow</h1>
    <p>Download for your system</p>

    <div class="status" id="status"><span class="spinner"></span>Detecting your system…</div>

    <div class="options hidden" id="options">
        <a class="btn btn-primary" id="winLink" href="https://app.sini.zip/4x-photo-slideshow_windows" rel="noopener">Windows version</a>
        <a class="btn" id="linuxLink" href="https://app.sini.zip/4x-photo-slideshow_linux/" rel="noopener">Linux version</a>
    </div>

    <noscript>
        <p class="meta" style="margin-top:16px;">JavaScript is off, so the automatic redirect is skipped. Pick your system above.</p>
    </noscript>

    <p class="meta hidden" id="meta"></p>
</main>

<script>
(function () {
    var WIN_URL   = 'https://apps.microsoft.com/detail/9nftsq8h859j';
    var LINUX_URL = 'https://app.sini.zip/4x-photo-slideshow_linux/';

    var statusEl = document.getElementById('status');
    var winLink  = document.getElementById('winLink');
    var linLink  = document.getElementById('linuxLink');
    var metaEl   = document.getElementById('meta');
    metaEl.classList.add('hidden');
    var options  = document.getElementById('options');

    winLink.href = WIN_URL;
    linLink.href = LINUX_URL;

    // Read one platform string and say what it describes ('windows', 'linux', 'other')
    // or '' when it carries no OS token at all.
    function platformTokens(str) {
        var s = (str || '').toLowerCase();
        if (!s) return '';
        // Android and ChromeOS run on a Linux kernel but are not desktop Linux.
        if (s.indexOf('android') !== -1 || s.indexOf('cros') !== -1 || s.indexOf('chrome os') !== -1) return 'other';
        if (s.indexOf('windows') !== -1 || s.indexOf('win32') !== -1 || s.indexOf('win64') !== -1) return 'windows';
        if (s.indexOf('linux') !== -1 || s.indexOf('x11') !== -1) return 'linux';
        return '';
    }

    // Detect the platform. Returns 'windows', 'linux' or 'other'.
    // The user agent wins; the client hint is only a fallback, because a browser may
    // keep it on the real OS while the user agent is overridden (and the two then
    // disagree). navigator.platform is deliberately ignored: it reports "Linux" for
    // Android phones and "Win32" for anything derived from Windows, so it would route
    // visitors to the wrong download instead of asking them.
    function detectPlatform() {
        var nav = window.navigator || {};
        var ua = nav.userAgent || '';
        var byUa = platformTokens(ua);
        if (byUa) return byUa;
        // A UA with no comment section is a frozen/reduced UA and may not name the OS
        // at all — only then does the client hint beat it.
        if (ua.indexOf('(') === -1) {
            var byHint = platformTokens(nav.userAgentData && nav.userAgentData.platform);
            if (byHint) return byHint;
        }
        return 'other';
    }

    function param(name) {
        var m = new RegExp('[?&]' + name + '=([^&]*)').exec(window.location.search || '');
        return m ? decodeURIComponent(m[1]).toLowerCase() : '';
    }

    // No confident match: do not guess and do not redirect. Show both downloads
    // and let the visitor pick.
    function showChooser(message) {
        statusEl.textContent = message;
        options.classList.remove('hidden');
        metaEl.innerHTML = 'Automatic detection is off for this visit.';
        metaEl.classList.remove('hidden');
    }

    // Manual override for testing/links: ?to=win | ?to=linux | ?stay=1 (or any value)
    var forced = param('to');
    var stay = window.location.search.indexOf('stay=') !== -1;

    var platform = forced === 'win' || forced === 'windows' ? 'windows'
                 : forced === 'linux' ? 'linux'
                 : detectPlatform();

    var target = platform === 'windows' ? WIN_URL : platform === 'linux' ? LINUX_URL : '';

    if (!target) {
        showChooser('We could not tell which system you are on. Choose your download:');
        return;
    }

    var label = platform === 'windows' ? 'Windows' : 'Linux';
    statusEl.innerHTML = '<span class="spinner"></span>Taking you to the ' + label + ' page…';

    // The link stays visible and usable if the redirect is blocked.
    options.classList.add('hidden');
    metaEl.innerHTML = 'Not redirected? <a href="' + target + '" rel="noopener" style="color:inherit">Open the ' + label + ' page</a>';
    metaEl.classList.remove('hidden');

    if (stay) return;

    setTimeout(function () {
        window.location.replace(target);
    }, 350);
})();
</script>
</body>
</html>
